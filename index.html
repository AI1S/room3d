<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Room3D · 3D 房源漫游</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0d'/%3E%3Crect x='7' y='12' width='18' height='13' rx='2' fill='%23d8b678'/%3E%3Cpath d='M16 5l9 7H7z' fill='%23f0e0bd'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Room3D</span>
      <span class="badge">W2 管线</span>
    </div>
    <select class="scan-select" id="scanSelect" hidden aria-label="切换房源"></select>
    <div class="title" id="sceneTitle">加载中…</div>
    <button class="icon-btn" id="btnTogglePanel" title="显示/隐藏信息栏">☰</button>
  </header>

  <nav class="chips" id="chips"></nav>

  <aside class="panel" id="panel">
    <section class="card">
      <h3>房源信息</h3>
      <dl id="metrics" class="metrics"></dl>
      <p class="note" id="captureNote"></p>
    </section>

    <section class="card">
      <h3>户型问答 <span class="tag">演示</span></h3>
      <div class="chat" id="chat">
        <div class="msg bot">试试问我：这套房多大？朝什么方向？衣柜内部能看到吗？</div>
      </div>
      <div class="suggest" id="suggest"></div>
      <form class="ask" id="askForm">
        <input id="askInput" type="text" placeholder="问点关于这套房的事…" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
    </section>

    <section class="card">
      <h3>工具</h3>
      <div class="tools">
        <button id="btnReset">重置视角</button>
        <button id="btnFlip">修正朝向</button>
        <button id="btnAuto">自动旋转</button>
        <button id="btnDrop">上传本地 splat</button>
      </div>
      <input type="file" id="fileInput" accept=".ply,.splat,.ksplat,.spz,.sog" hidden />
      <p class="note">把 Postshot / Luma / SuperSplat 导出的文件直接拖进页面也能看。</p>
    </section>
  </aside>

  <div class="hint" id="hint">
    <span class="hint-desk">左键拖动旋转 · 滚轮缩放 · 右键平移</span>
    <span class="hint-touch">单指拖动旋转 · 双指缩放</span>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlayText">正在加载场景…</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="overlay-sub" id="overlaySub"></div>
    </div>
  </div>

  <div class="drop-hint" id="dropHint">松开载入文件</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
